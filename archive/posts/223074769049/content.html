<!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e40-dab0-11ed-86bc-1791c3d28cde" style=""><span class="se-fs- se-ff-" id="SE-c0e955d9-dab0-11ed-86bc-b5888dc29b6a" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e42-dab0-11ed-86bc-17f240b13569" style=""><span class="se-fs- se-ff-" id="SE-c0e955da-dab0-11ed-86bc-7184f467aa32" style=""> 생일 축하 노래 부르고 케이크 먹고... (선생이)</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e44-dab0-11ed-86bc-57f8a85563b8" style=""><span class="se-fs- se-ff-" id="SE-c0e955db-dab0-11ed-86bc-b7b952e7fd29" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e46-dab0-11ed-86bc-2b1aaed48209" style=""><span class="se-fs- se-ff-" id="SE-c0e955dc-dab0-11ed-86bc-3bdfad45ed76" style=""> 다른 축하의 의미가 담긴 노래도 몇 곡 더 부르며 인연 스토리와 캐릭터 분석 컨텐츠를 진행했습니다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e48-dab0-11ed-86bc-e51902a31003" style=""><span class="se-fs- se-ff-" id="SE-c0e955dd-dab0-11ed-86bc-1dd8530aafa9" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e4a-dab0-11ed-86bc-0f7c756bfd9f" style=""><span class="se-fs- se-ff-" id="SE-c0e955de-dab0-11ed-86bc-2f0a66948892" style=""> 즐거운 시간이었지만 시청자 분들이 없어서 자꾸꾸 고민하게 되네요.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e4c-dab0-11ed-86bc-5b9501328d69" style=""><span class="se-fs- se-ff-" id="SE-c0e955df-dab0-11ed-86bc-ed44164a0730" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c0e81e4e-dab0-11ed-86bc-fda98a35159f" style=""><span class="se-fs- se-ff-" id="SE-c0e955e0-dab0-11ed-86bc-af47f01aa7db" style=""> 주말에는 컨
