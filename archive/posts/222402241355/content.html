<!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-b2634b42-3aa5-42e5-b19f-98f0f8df331a" style=""><span class="se-fs- se-ff-" id="SE-f036d70a-f35d-41dd-b4f3-611d56596b69" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-e6c3a160-408d-4d95-a44d-b43cf9fc13b4" style=""><span class="se-fs- se-ff-" id="SE-51fc5735-f27c-4036-8f27-9918809b9868" style=""> 또 바퀴벌레랑 전쟁하느라 제대로 잠을 못 잤다. 도대체 바퀴벌레는 왜 존재하는 것인가. 생각해보니 생존력이 부족해서 그렇지 나도 바퀴벌레랑 별로 안 다른가 싶기도 하다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-5f1d4a5d-5155-40bf-a13f-814f141500dc" style=""><span class="se-fs- se-ff-" id="SE-856e06af-b216-43f3-a717-59bb0649de53" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-777207b7-ea83-4d2b-b973-e5171dd3e5fb" style=""><span class="se-fs- se-ff-" id="SE-a10e175a-e2b9-4c49-b101-5629a8c578ad" style=""> 회식자리에 평소 인사를 잘 안 받아주시던 포크레인 기사님이 오셨다. 아무튼 이 하루는 좀 우마뾰이했다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-a1e84f9e-c9d0-409e-b7a8-5ed38434c1a4" style=""><span class="se-fs- se-ff-" id="SE-baab7f28-7882-44c7-aadf-0cdb0d045bcf" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-c37bbb2c-4ae2-4626-a885-ba19ac430638" style=""><span class="se-fs- se-ff-" id="SE-7fbe8624-27d4-4513-94fb-24de1d0d53ab" style=""> 여자친구 못 사귀어 봤다고 극딜을 계속 당하고 있다. 도당체 나 같은 인간이 어케 인간과 교제를 할 수 있단 말인가? 인생 헛 살았네는 솔직히 듣고 좀 어질어질했다...</span></p><!-- } SE-TEXT -->
