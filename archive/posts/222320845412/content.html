<!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-52216cc1-a43b-11eb-9d8f-c9300e455194" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-52216cc0-a43b-11eb-9d8f-f900480de661" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-52216cc3-a43b-11eb-9d8f-b56f71c9ba51" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-52216cc2-a43b-11eb-9d8f-7b24bc771757" style=""> 고대하던 금요일. 퇴근 전까지 꽤나 힘들었지만 결국, 나는 승리하였다. 내일도 잠깐 매장에 들려야 하지만 이무튼 퇴근한 나의 승리다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-52216cc5-a43b-11eb-9d8f-e7f507ad21bd" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-52216cc4-a43b-11eb-9d8f-0ba1666b12bd" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-52216cc7-a43b-11eb-9d8f-31f78e8b7161" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-52216cc6-a43b-11eb-9d8f-994b757037ff" style=""> 오랜만이 4인 집회. 다음 주에도 또 모이기로 약속하고 즐겁게 놀았다. 곧 입대하는 동생에게 저녁을 사주겠다고 모인 것이었는데 내가 주식도 처분하여 이익 좀 실현했다고 한 턱 냈다.</span></p><!-- } SE-TEXT -->
