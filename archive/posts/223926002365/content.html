<!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-8d36218e-5bad-11f0-99c4-3da717fb0019" style=""><span class="se-fs- se-ff-" id="SE-feb6116b-5bad-11f0-99c4-718f4856b104" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-8d419344-5bad-11f0-99c4-bf0cceabad87" style=""><span class="se-fs- se-ff-" id="SE-feb6116c-5bad-11f0-99c4-13a4e79db6c5" style=""> 날이 정말 덥죠... 주인장입니다. 출하장에서 복숭아 박스 나르고 정리하고 땀 뻘뻘 흘리고 있습니다. 요즘 잠을 잘못 자서 큰일이네요. 그래도, 아침에 일어나고 밤에 자긴 하니까 괜찮을지도? 활동량 압도적으로 늘었도 땀도 엄청 내보내고 있으니 일주일이면 3키로는 빠질 것 같아요. 참고로, 다음 주 부터는 2주에 하루씩만 쉽니다. 열심히 벌어서... 열심히 모으는.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-d76621f2-5bad-11f0-99c4-5fa2356eafb1" style=""><span class="se-fs- se-ff-" id="SE-feb6116d-5bad-11f0-99c4-4dfe87402906" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-d75272e1-5bad-11f0-99c4-238b8cd79f48" style=""><span class="se-fs- se-ff-" id="SE-feb6116e-5bad-11f0-99c4-fb46310d4b0f" style=""> 순애챈 망령입니다. 챈에 올렸던 거 좀 정리하고 다듬어서 블로그에도 올려보겠습니다. 순애좋아.</span></p><!-- } SE-TEXT -->
