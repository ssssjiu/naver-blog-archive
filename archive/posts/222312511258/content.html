<!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a58c56-9eab-11eb-93fc-73edcfb17d6b" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398242-9eab-11eb-93fc-ed3e1d2cdfa2" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a5b368-9eab-11eb-93fc-cdca9c76c913" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398243-9eab-11eb-93fc-dbfe0b07b914" style=""> 결국, 한 주가 지나가고 다시 주말이 찾아왔다. 눈물이 날 정도로 고생한 느낌이어서 이번 주말 맞이가 더 각별하다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a5b36a-9eab-11eb-93fc-539ff18510a9" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398244-9eab-11eb-93fc-917d77e6e7cf" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a5b36c-9eab-11eb-93fc-6fd750c848e7" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398245-9eab-11eb-93fc-1baddc0d6e65" style=""> 매장에 대한 충성도가 더 올라갔다. 여러가지 고려해야 하는 점도 있겠지만 지금 나의 일터이니 긍정적으로 생각해보려 한다.</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a5b36e-9eab-11eb-93fc-ab72a577916f" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398246-9eab-11eb-93fc-87981cd19b40" style="">​</span></p><!-- } SE-TEXT --><!-- SE-TEXT { --><p class="se-text-paragraph se-text-paragraph-align-" id="SE-35a5b370-9eab-11eb-93fc-051f8fb8303c" style="line-height:1.8;"><span class="se-fs- se-ff-" id="SE-3c398247-9eab-11eb-93fc-9563245c40cd" style=""> 아는 동생과 저녁을 먹었다. 밖에서 마파두부를 처음 먹었는데 생각보다 맛있어서 놀랐다.</span></p><!-- } SE-TEXT -->
