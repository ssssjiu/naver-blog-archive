    <section class="post-list"><article class="card" data-search="심야의 랑데부 - 8 심야의 랑데부 ​ &quot;그러고 보니 이걸 어쩐담.&quot; ​ 평소보다 아침 일찍 일어나 출근 준비를 하고 있던 나는 책상 구석에 자리 잡고 있는 물건을 발견하고는 머릿속이 복잡해졌다. ​ &quot;지금 와서 돌려주기도 애매한가?&quot; ​ 양치질을 하면서 여전히 비싼 아우라를 뿜어내고 있는 150만 원 상당의 최신 휴대전화 패키지 박스를 본다. ​ &quot;푸후아.&quot; ​ 양치질을 끝내고 흰색 셔츠 위에 파란색 조끼, 은색 빛을 띄는 흰 코트를 차려입고는 얼굴을 확인하기 위해 다시 거울 앞에 섰다. &quot;앗아야.&quot; ​ 자신의 얼굴만 뚫어지게 쳐다보고 있자니 기분이 이상해서 몸이라도 가볍게 풀어보려고 어깨를 돌렸지만 뚜둑거리는 소리와 함께 어제 운동의 결과가 나를 덮쳐왔다. ​ &quot;이건 좀 더 뒤에 얘기하지 뭐.&quot; ​ 넓지 않은 집 안에 고가의 휴대전화를 방치해두고 어제보다는 조금 이른 시간에 출근길에 올랐다. ​ &quot;눈부신 아침이야.&quot; ​ 밖으로 나오니 출근한다는 건 변함이 없어서 기분이 썩 좋이 않을지 언정 깨끗한 공기로 가득한 하늘은 보기 좋았다. 구름이 자취를 감춘 새파란 하늘을 멍하니 올려다보고 있는 게 좋았던 나는 얼마나 그러고 있었는지도 모른 채 몇 분이나 집 앞에 서있었다. &quot;거, 길 좀 묻겠소.&quot; ​ &quot;우왓?&quot; ​ 내 머리 위에서 중후한 목소리가 들려와서 깜짝 놀란 나는 뒤로 넘어질 뻔했다. ​ &quot;아침부터 기운이 넘치는 분이구먼 그래.&quot; ​ 분명 내 주변에는 아무도 없는데 계속 목소리가 들려왔다. 어제 핏덩이 괴물 귀신과 싸우는 과정에서 내게 뭔가 붙어버린 걸까 싶었지만, 밤에는 아무 일도 없었기에 의아했다. ​ &quot;하하핫, 이거 소인이 모습을 너무 숨겼구만.&quot; ​ 가벼운 웃음소리와 함께 내 눈앞에 너덜너덜한 천 옷을 걸친 거구의 남성이 나타났다. ​ &quot;당신은 또 뭡니까...&quot; ​ 이미 한 번 크게 놀란 나는 별다른 반응을 보이지 않으면서 얼굴마저 천으로 가린 거구의 수상한 남성에게 물었다. ​ &quot;소인이 인간이 아니라는 건 알고 계신 듯하군. 그럼 바로 용무를 얘기하겠소.&quot; ​ 묘하게 살기를 띄우는 모습에 나는 긴장했지만 거구의 남성은 허리춤에 차고 있던 검집을 나에게 내밀었다. ​ &quot;설마 자결하라는 건가요?&quot; &quot;하하핫. 농담에 능한 분이시고만. 이건 내가 인간에게 주는 의뢰라네 도령.&quot; ​ &quot;도령은 뭡니까? 아무튼 저랑 초면이신 것 같습니다만?&quot; ​ &quot;그랬군. 그럴지도 모르겠소.&quot; ​ &quot;아니 이게 무슨...&quot; ​ 잠시 살기가 가득한 분위기는 아예" data-status="active" data-category="18" data-video="0"><div class="card-row"><div class="card-main"><h2><a href="../../posts/222414110745/index.html">심야의 랑데부 - 8</a></h2><div class="meta">2026-10-05T20:22:26+09:00</div></div></div></article><article class="card" data-search="심야의 랑데부 - 10 심야의 랑데부 입구쪽 문이 눈에 아른거리지만 손의 움직임은 멈추지 않았고, 바로 옆에 자리 잡고 있는 진열대에 어떤 문장이 숨겨져 있을지 궁금해서 참을 수가 없었다. ​ &quot;이거 나 혼자서 대처해도 괜찮은 거 맞겠지?&quot; ​ 물론 호기심이 뇌를 지배한 상태라 누군가가 말리려고 해도 어떻게든 답을 보려고 하겠지만, 문제는 &#x27;끝까지 봐도 괜찮은가?&#x27; 뿐이었다. 혹시나 다 찾아냈더니 갑자기 저주 같은 게 걸린다던가 수수께끼를 낸 귀신이 직접 나타나서 공격을 한다던가 하면 매우 문제다. ​ &quot;지금 시간에 유하나를 부를 수도 없고...&quot; ​ 바닥 쓸기를 멈춘 손이 계속 떨리고 있었지만 천천히 진열대에 꽂혀있는 책들로 손이 갔다. ​ &quot;이거 괜찮은 거 맞지?&quot; ​ 반복해서 자신에게 되물어도 불안감을 떨쳐낼 수 없었지만 눈이 다시 책들의 앞 글자를 훑었다. ​ &quot;혼자서...&quot; ​ 소름이 돋았다. 잠깐 멍해져서 가만히 서있는 동안에 책들의 배열이 원래대로 돌아갔고 나는 지금과 비슷한 감정을 느꼈던 때를 떠올렸다. 어릴 때... 적어도 10년 전쯤에 유사 따돌림을 당했을 때에도 혼자서 어딘가로 나오라는 말은 들은 적이 없었다. 그런데 지금 이 귀신은 나에게 혼자 나와서 무엇을 하겠다는 걸까? 더군다나 장소와 시간도 알려주지 않았기에 그 불편함이 나를 더 불쾌하게 만들었다. ​ &quot;아무튼 일단 청소는 끝.&quot; ​ 어떤 일이 생길지 모르는 불안감이 몰려와도 지금의 나는 어제의 나와는 다르다. 알 수 없는 검도 있고, 왠지 모르게 귀신과 대화로 잘 해결할 수 있을 것 같은 자신감도 차있었다. 적어도 다짜고짜 날 죽이려 드는 야만적인 존재가 아니라면 어떻게든 해볼 수 있을지도 모른다는 생각이 들었다. &quot;그럼...&quot; ​ 이제 남은 일은 저녁때까지 홀로 도서실을 지키는 것뿐. 그 동안에 또 이상한 귀신과 얽히지 않으면 다행이겠지만 벌써 2번이나 휘말려서 기분이 영 좋지는 않았다. 그래도 공격을 당하거나 충격을 받는 일은 생기지 않았지만, 평범한 일상과는 달라진 방심할 수 없는 매순간이 나를 지치게 만들었다. ​ &quot;다 내가 살면서 쌓은 덕이 부족해서 그런 걸꺼야.&quot; ​ 납득할 수 없는 이유들이 머릿속에서 넘쳐흘렀지만 당분간은 비관하는 자세는 버려야 어떻게든 현실에서 살아남을 수 있을 거라고 확신한 나는 잠시 생각하는 것을 그만두었다. ​ ------- ​ 잠시 멍하니 앉아있다가 정신을 차려보니 어느새 저녁시간이 되었다. 종이 울리고 어김없이 유하나가 도서실로" data-status="active" data-category="18" data-video="0"><div class="card-row"><div class="card-main"><h2><a href="../../posts/222443891013/index.html">심야의 랑데부 - 10</a></h2><div class="meta">2026-10-05T20:22:14+09:00</div></div></div></article><article class="card" data-search="심야의 랑데부 - 11 심야의 랑데부 ​ 자율 학습시간이 시작되고 10분 정도 지나자 무심코 카운터와 가까운 쪽에 앉아 있는 유하나 쪽에 시선을 옮기던 나는 눈이 마주쳤다. 그러자 기다렸다는 듯이 장난기 가득한 미소를 띤 채 윙크를 했다. &#x27;집중 안 하고 있네.&#x27; ​ 내가 시큰둥하게 반응하는 모습에도 아랑곳 않고 계속 나에게서 눈을 떼지 않아서 먼저 시선을 돌렸다. 혹시나 나 때문에 공부가 잘 안 되는 건가 싶어서 잠깐 나가려고 했지만, 시작한지 얼마 안 된 이 시점에서 나가면서 나는 의자 소리와 문소리가 다른 학생들에게 방해될 수도 있기에 일어서려다가 다시 다리에 들어간 힘을 풀었다. ​ &#x27;유하나 때문에 그런가 오늘은 유난히 시간이 안 가는 걸.&quot; ​ 저녁 시간에 내가 도서실을 지킬 필요는 없었지만 다른 곳에서 시간을 죽이는 것도 별로 효율적이지도 않고 숙직실을 빌려서 쉬어도 잠들 확률이 커서 좋은 생각이 아니고... 애초에 7시 조금 넘은 시간에 잤다가는 밤에 못 자서 아침에 피곤하기만 하다. 그렇다고 도서실 내부 창고로 이동하기에는 행정실에서 열쇠를 안 챙겨왔다. ​ &quot;-딩동&quot; ​ 어찌어찌 1시간을 버텨내고 쉬는 시간이 되었다. 유하나는 자연스럽게 내가 있는 카운터 쪽으로 걸어왔고 다른 학생들은 화장실에 가려고 하는지 다 빠른 걸음으로 도서실에서 나갔다. ​ &quot;저녁 먹은 뒤라서 너무 졸리네요.&quot; ​ &quot;그건 동감이다.&quot; ​ 유하나는 카운터 책상에 몸을 늘어트리면서 기지개를 폈고 나는 내 쪽으로 서서히 뻗어오는 손을 보고는 미리 뒤쪽으로 몸을 움직여 피했다. ​ &quot;남은 2시간 동안은 자리 비울 예정이니까 공부 열심히 해.&quot; ​ &quot;네~&quot; ​ 수상하게 다른 말없이 대답하는 걸 보고 의아했지만 분명 부유령님이 오늘 밤에 뭔가 있을 거라고 알려주신 듯했다. 다른 건 몰라도 귀찮지 않게 설명을 하지 않아도 되어서 참 다행이었다. ​ &quot;아, 이거 가져가세요.&quot; ​ &quot;뭐야?&quot; ​ 유하나가 가방을 챙겨서 도서실을 나가려는 나를 붙잡고는 요즘 보기 드문 복주머니를 건네주었다. ​ &quot;전형적인 빨간색에다가 노란 글씨... 오히려 정겨워서 좋네.&quot; ​ &quot;부유령님이 유사시에 활용하시면 된다고 하시네요.&quot; ​ 안에 뭐가 들었는지는 대충 감이 왔다. 가방에 아침에 받은 도검도 있고 이 복주머니 구성품까지 손에 있으니 걱정이 줄었다. ​ &quot;알았어... 근데?&quot; ​ 역시 내가 뭘 하러 가는지 어느 정도 아는지 복주머니를 건네주고는 다시 자리로 돌아갔다. ​ &quot;별일 없기를.&quot;" data-status="active" data-category="18" data-video="0"><div class="card-row"><div class="card-main"><h2><a href="../../posts/222447046681/index.html">심야의 랑데부 - 11</a></h2><div class="meta">2026-10-05T20:22:13+09:00</div></div></div></article></section>
