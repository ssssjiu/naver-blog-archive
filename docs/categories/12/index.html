    <section class="post-list"><article class="card" data-search="중가 위스키 - 우드 포드 리저브, 조니 워커 골드 라벨 위스키 ​ 어제 장보러 이마트에 갔다가 양주 코너를 봤는데 생각보다 종류가 많아서 위스키 두 개를 아버지께서 질러버리셨습니닷. ​ 제가 좋아하는 조니 워커의 상급 라인업인 골드 라벨. 역시나 포장지도 병도 고급스러워 보이고 좋습니다. ​ 그리고... 더 고급인 우드 포드. 버번 종류라는데 10만원이 넘는 꽤나 값나가는 녀석이었습니다. 골드 라벨니 7만원 선이었는데 이 우드 포드 리저브는 12만원... 딱 한 잔 마셔봤는데 43도의 맛은 강렬했습니다. 좋은 술이니 아껴마실 것 같습니다." data-status="active" data-category="12" data-video="0"><div class="card-row"><div class="card-main"><h2><a href="../../posts/222386048391/index.html">중가 위스키 - 우드 포드 리저브, 조니 워커 골드 라벨</a></h2><div class="meta">2026-10-05T20:22:53+09:00</div></div><a class="card-thumb" href="../../posts/222386048391/index.html"><img src="../../posts/222386048391/images/4e3b6cfe5c6dc4629713.jpg" alt="" loading="lazy"><span>2</span></a></div></article><article class="card" data-search="3. 조니 워커 최고 클래스 블루 라벨 위스키 ​ 위스키 카테고리로 언제쯤 다시 글을 게시할까 고민하다가 마침 최근에 제가 양주를 입문하게 만든 조니 워커 블루 라벨을 드디어 구매 후 마셔보기까지 하여서 한 번 끄적여볼까 합니다. ​ 술에 관련된 정보는 정말 부족한 술린이이며, 대부분의 정보는 위키를 참조하여서 글을 작성하는 부분 양해 바랍니다. ​ 조니 워커! 국내에서는 꽤나 유명한 스카치 위스키 브랜드 중 하나이면서도 세계적으로도 블렌디드 위스키로 유명한 브랜드입니다. 영국 스코틀랜드에서 생산된다고 합니다. ​ 저는 조니 워커가 양주이자 위스키의 입문 술이었는데요, 스탠다드급 위스키인 레드 라벨로 시작하여 무난한 블랙 라벨, 더 나아가 더블 블랙 라벨로 경험치를 쌓은 뒤 구매만 하고 마셔보지 않은 골드 라벨 리저브를 넘어서 결국 제가 꿈에 그리던 영롱한 푸른빛의 블루 라벨을 구매하여서 직접 마셔보았습니다. ​ ​ 겉옷부터 상당히 고급스러운 느낌이 들어서 좋았습니다. 제가 구매한 것은 500ml로 가격은 184000원이었습니다. 750ml는 24만 원이 넘어가서 위스키 같은 도수 높은 술을 한 번에 많이 마시지 않는 저는 그냥 500ml로 승부를 보았습니다. ​ ​ 케이스를 개봉한 뒤의 모습입니다. 일련번호와 푸른색 라벨이 눈에 잘 띕니다. 여러모로 감격스러웠던 저는 코르크 마개를 오픈한 뒤에 먼저 향을 맡아 보았는데요, 역시 아직 맛도 구분 못하는 저에게는 향으로 블랙 라벨과 큰 차이점을 느끼지는 못했습니다. 블루 라벨의 강점이 향이라고 들었던 것 같은데 아직 저에게는 어림도 없었습니다. 그래도 스트레이트로 한 잔, 온더록스로 한 잔, 사이다와 섞어서 하이볼처럼 한 잔 마셔보니 참으로 좋긴 했습니다. 뭐 이러니저러니 분위기로 맛이 만들어졌다고 생각하지만 만족스럽긴 했습니다. ​ 잔이 워낙 별로여서 잔에 따른 뒤에 사진을 별도로 찍어두지 않아서 좀 아쉽습니다. 다음에는 걸맞은 괜찮은 잔도 하나 구입할 생각입니다. 하이볼 잔도 따로 있다고 하니 그것도 하나 구매해 볼 생각입니다. 다음은 아직 개봉조차 하지 않은 골드 라벨을 들고 돌아오겠습니다. 그리고 위스키를 즐기는 여러 방법도 시도해 보고 게시할 예정입니다. 아직 술맛과 향은 거의 구분하지 못하지만 이상하게 위스키에 빠져서 돈을 써보는 정신 나간 필자였습니다. 그래도 가챠에 쓰는 것보다는 비싼 술을 구매해서 지인들과 나누는 게 더 좋지 않은가..." data-status="active" data-category="12" data-video="0"><div class="card-row"><div class="card-main"><h2><a href="../../posts/222611649236/index.html">3. 조니 워커 최고 클래스 블루 라벨</a></h2><div class="meta">2026-10-05T20:21:33+09:00</div></div><a class="card-thumb" href="../../posts/222611649236/index.html"><img src="../../posts/222611649236/images/ca9407344d32a6152449.jpg" alt="" loading="lazy"><span>2</span></a></div></article></section>
