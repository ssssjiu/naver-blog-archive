name: Archive Naver Blog

on:
  schedule:
    - cron: "2/5 * * * *"
    - cron: "23 */6 * * *"
    - cron: "41 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "maintenance"
        type: choice
        options: [fast, maintenance, discover]

permissions:
  contents: write

concurrency:
  group: naver-blog-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Choose mode and archive
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          TZ: Asia/Seoul
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$EVENT_SCHEDULE" = "2/5 * * * *" ]; then
            MODE="fast"
          elif [ "$EVENT_SCHEDULE" = "41 18 * * *" ]; then
            MODE="discover"
          else
            MODE="maintenance"
          fi

          echo "Mode: $MODE"
          case "$MODE" in
            fast) python crawler.py --fast ;;
            discover) python crawler.py --discover ;;
            *) python crawler.py --maintenance ;;
          esac
      - name: Commit archive changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive docs state
          git commit -m "archive: sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
