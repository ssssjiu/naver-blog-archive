name: External Fast Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-blog-external-fast
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Validate crawler
        run: python -m py_compile crawler.py

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast RSS check
        env:
          TZ: Asia/Seoul
        run: python crawler.py --fast

      - name: Commit archive changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git add archive docs state
          git commit -m "archive: external fast sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
